name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun test
      - run: bun scripts/check.mjs
      - name: provenance prerequisites (repository field must point at this repo)
        run: node -e "const p=require('./package.json'); if(!p.repository?.url) { console.error('package.json has no repository.url — npm publish --provenance would fail or lose provenance. Fill it before tagging.'); process.exit(1) }"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
